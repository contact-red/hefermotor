name: PR

on: pull_request

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: read

jobs:
  superlinter:
    name: Lint bash, docker, markdown, and yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Lint codebase
        uses: docker://github/super-linter:v3.8.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_BASH: true
          VALIDATE_DOCKERFILE: true
          VALIDATE_MD: true
          VALIDATE_YAML: true

  verify-changelog:
    name: Verify CHANGELOG is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Verify CHANGELOG
        uses: docker://ghcr.io/ponylang/changelog-tool:release
        with:
          args: changelog-tool verify

  test-static:
    name: Run Tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/redvers/pony-dependency-builder:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: make test
        run: |
          echo "ulimit -s: $(ulimit -s), hard: $(ulimit -H -s)"
          if [ "$(ulimit -s)" = unlimited ]; then ulimit -s 8192; fi
          make
      - name: make test-stack
        run: make test-stack

  determinism:
    name: Determinism harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/redvers/pony-dependency-builder:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: make determinism
        run: |
          if [ "$(ulimit -s)" = unlimited ]; then ulimit -s 8192; fi
          make determinism

  differential:
    name: Differential harness against ponyc
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/redvers/pony-dependency-builder:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Clone ponyc at the pinned commit
        run: |
          git init -q "$RUNNER_TEMP/ponyc-src"
          git -C "$RUNNER_TEMP/ponyc-src" remote add origin \
            https://github.com/ponylang/ponyc.git
          git -C "$RUNNER_TEMP/ponyc-src" fetch -q --depth 1 origin \
            6a0bfa80b49acc65b998c6db56ed913e55221c0a
          git -C "$RUNNER_TEMP/ponyc-src" checkout -q --detach FETCH_HEAD
      - name: Token table drift gate
        run: |
          cp hefermotor/parse/token_kind.pony "$RUNNER_TEMP/token_kind.pony"
          make regen-token-kinds PONYC_SRC="$RUNNER_TEMP/ponyc-src"
          diff "$RUNNER_TEMP/token_kind.pony" hefermotor/parse/token_kind.pony
      - name: make differential
        run: |
          if [ "$(ulimit -s)" = unlimited ]; then ulimit -s 8192; fi
          make differential
      - name: make corpus
        run: |
          if [ "$(ulimit -s)" = unlimited ]; then ulimit -s 8192; fi
          make corpus PONYC_SRC="$RUNNER_TEMP/ponyc-src"
